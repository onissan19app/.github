name: Signaler un défaut
description: Décrire un comportement incorrect de façon reproductible
body:
  - type: textarea
    id: problem
    attributes:
      label: Problème observé
      description: Que s’est-il passé et quel résultat attendais-tu ?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes pour reproduire
      description: Donne les étapes minimales et reproductibles.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Produit, version, appareil ou environnement pertinent. N’inclus aucune donnée sensible.
    validations:
      required: false
